input_dir: ./input
output_dir: ./output
archive_dir: ./archive
working_dir: ./working
reports_dir: ./reports
database_path: ./los80.sqlite
max_retries: 2
include_subtitles: true
include_translation: true
translation_model: facebook/nllb-200-distilled-600M
translation_device: auto
translation_batch_size: 8
enable_duplicate_detection: false
# Preflight media analysis. Set any recommendation override to null to use the
# analyzer's decision, or true/false/a value to force it for every video.
analysis_enabled: true
analysis_force: false
analysis_generate_gif: false
analysis_quality_threshold: 80
analysis_deinterlace: null
analysis_denoise: null
analysis_sharpen: null
analysis_model: null
analysis_tile_size: null
analysis_encoder_preset: null
analysis_skip: null
parallel_enabled: false
cpu_workers: 2
io_workers: 2
adaptive_batching: true
max_batch_size: 8
disk_reserve_bytes: 2147483648
cleanup_enabled: true
cleanup_max_age_seconds: 86400
job_lease_seconds: 21600
whisper_model: base
whisper_device: cpu
whisper_compute_type: int8
# Optional Real-ESRGAN executable or extracted runtime directory. Leave null
# to use the automatically managed cache.
realesrgan_backend_path: null
upscaler_scale: 4
upscaler_output_format: png
upscaler_verbose: false
supported_extensions:
  - .mp4
  - .mkv
  - .mov
  - .avi
stages:
  - scan
  - analysis
  - audio_extraction
  - subtitles
  - translation
  - upscaling
  - encoding
  - validation
  - upload
  - archive
