input_dir: ./input
output_dir: ./output
archive_dir: ./archive
working_dir: ./working
reports_dir: ./reports
database_path: ./los80.sqlite
max_retries: 2
include_subtitles: true
include_translation: true
enable_duplicate_detection: false
whisper_model: base
whisper_device: cpu
whisper_compute_type: int8
supported_extensions:
  - .mp4
  - .mkv
  - .mov
  - .avi
stages:
  - scan
  - audio_extraction
  - subtitles
  - translation
  - upscaling
  - encoding
  - validation
  - upload
  - archive
